name: CI Pipeline

on:
  push:
    branches: [ main, developer, test ]
  pull_request:
    branches: [ main, developer, test ]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-directory: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend Unit Tests
        run: npm test

      - name: Build Backend
        run: npm run build

  frontend-test:
    name: Frontend Analyze & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test
