appId: com.example.frontend_app
name: Quên mật khẩu - điều hướng và validate
tags: [auth]
---
- runFlow: ../subflows/launch_clean.yaml
- tapOn: 'Quên mật khẩu?'
- assertVisible: 'Khôi Phục Mật Khẩu'
- assertVisible: 'Quên Mật Khẩu?'
- tapOn: 'GỬI MÃ XÁC XNẬN'
- assertVisible: 'Vui lòng nhập Email'
- tapOn: 'Email'
- inputText: 'sai-dinh-dang'
- tapOn: 'GỬI MÃ XÁC XNẬN'
- assertVisible: 'Email không hợp lệ'
- back
- assertVisible: 'ĐĂNG NHẬP'
