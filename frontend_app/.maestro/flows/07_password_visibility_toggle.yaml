appId: com.example.frontend_app
name: Login - ẩn/hiện mật khẩu
tags: [auth]
---
- runFlow: ../subflows/launch_clean.yaml
- tapOn: 'Mật khẩu'
- inputText: 'Maestro@123'
- assertNotVisible: 'Maestro@123'
- tapOn:
    point: '90%,50%'   # suffixIcon visibility; chỉnh nếu layout đổi
- assertVisible: 'Maestro@123'
